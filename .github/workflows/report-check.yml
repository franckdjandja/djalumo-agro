name: Report check
# Builds the PDF report for about 120 visitor choices and fails if any page shows a defect.
# Runs when the report, the planner engine or its data change, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'lib/report/**'
      - 'site/src/engine.cjs'
      - 'site/data/kb.json'
      - 'scripts/report-qa/**'
  pull_request:
    paths:
      - 'lib/report/**'
      - 'site/src/engine.cjs'
      - 'site/data/kb.json'
      - 'scripts/report-qa/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install --quiet fonttools
      - run: npm run check:reports
