# After each deployment of the site: the public pages answer, the forms refuse a bad request,
# and the health check sees the database and the mail server. Results appear as notices on the run.
name: Site check
on:
  push:
    branches: [main]
    paths: ['site/**', 'api/**', 'lib/**', 'db/**', '.github/workflows/site-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the deployment
        run: sleep 150
      - name: Check the live site
        env:
          SITE: https://agro.djalumo.com
        run: |
          fail=0
          for p in / /fr /offers /fr/offers /planner /fr/contact; do
            code=$(curl -s -o page.html -w '%{http_code}' "$SITE$p")
            if [ "$code" = "200" ]; then echo "::notice title=page $p::HTTP $code"; else echo "::error title=page $p::HTTP $code"; fail=1; fi
          done
          curl -s "$SITE/fr/offers" | grep -q 'id="f-quote"' && echo "::notice title=offers form::present" || { echo "::error title=offers form::missing"; fail=1; }
          health=$(curl -s "$SITE/api/health?mail=verify")
          echo "::notice title=health::$health"
          echo "$health" | grep -q '"database":"ok"' || { echo "::error title=database::not ok"; fail=1; }
          echo "$health" | grep -q '"mail":"ok"' || { echo "::error title=mail::not ok"; fail=1; }
          # Every page of the sitemap, in both languages
          curl -s "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' > urls.txt
          total=$(wc -l < urls.txt); bad=0
          while read -r u; do code=$(curl -s -o /dev/null -w '%{http_code}' "$u"); [ "$code" = "200" ] || { echo "::error title=sitemap page::$u HTTP $code"; bad=$((bad+1)); }; done < urls.txt
          [ "$bad" = "0" ] && echo "::notice title=sitemap::all $total pages answer 200" || fail=1
          # Script, style sheet, robots and the demonstration videos
          curl -s "$SITE/" > home.html
          for a in $(grep -o '/assets/[^"]*\.\(js\|css\)' home.html | sort -u) /robots.txt /img/demo/planner-demo-en.mp4 /img/demo/planner-demo-fr-m.mp4 /img/demo/planner-teaser-fr.mp4; do
            code=$(curl -s -o /dev/null -I -w '%{http_code}' "$SITE$a"); [ "$code" = "200" ] && echo "::notice title=asset::$a 200" || { echo "::error title=asset::$a HTTP $code"; fail=1; }
          done
          for f in quote contact; do
            body=$(curl -s -o resp.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Origin: $SITE" --data '{"email":"not-an-address"}' "$SITE/api/$f")
            if [ "$body" = "422" ]; then echo "::notice title=api $f::refuses an invalid request ($(cat resp.json))"; else echo "::error title=api $f::HTTP $body $(cat resp.json)"; fail=1; fi
          done
          exit $fail
